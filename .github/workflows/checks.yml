name: Checks

# Everything but main. There the same checks run inside the deploy workflow, which has to gate the
# deploy on them anyway, so a second run would only hold the deploy up.
on:
  push:
    branches-ignore: [main]
  pull_request:
    branches: [main]

# A branch that is pushed again mid-run does not need the answer to the older push.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test:run

      - name: Keep what the visual regression saw
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: visual-regression
          path: |
            tests/alignment/__snapshots__/performance-rendered.png
            tests/alignment/__snapshots__/performance-overlay.png
          if-no-files-found: ignore
