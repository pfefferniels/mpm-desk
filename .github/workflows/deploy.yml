name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.again.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The tests measure the reconstruction as published, and this repository keeps no copy.
      - name: Checkout welte225.org
        uses: actions/checkout@v7
        with:
          repository: pfefferniels/welte225.org
          path: welte225.org

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unused code
        run: npm run knip

      - name: Test
        run: npm run test:run
        env:
          WELTE225: welte225.org

      - name: Keep what the visual regression saw
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: visual-regression
          path: |
            tests/alignment/__snapshots__/performance-rendered.png
            tests/alignment/__snapshots__/performance-overlay.png
          if-no-files-found: ignore

      - name: Build
        run: npm run build

      # Named by the attempt, on both sides. An artifact belongs to the run and not to the
      # attempt, so a re-run uploads a second one under the same name, and `deploy-pages` refuses
      # to choose between two. That is every re-run after a deploy that got as far as uploading:
      # Pages answered one with a 502, and the retry it asked for could not go through.
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist
          name: github-pages-${{ github.run_attempt }}

      # Once more, a minute later, where the first could not find the artifact. `deploy-pages`
      # looks for it among the run's artifacts a moment after it is uploaded, and a new one is not
      # always listed yet: on 23 November 2026 three attempts running found every artifact but
      # their own, and a re-run only repeats the race.
      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}

      - name: Wait for the artifact to be listed
        if: steps.deployment.outcome == 'failure'
        run: sleep 60

      - name: Deploy to GitHub Pages, again
        id: again
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
