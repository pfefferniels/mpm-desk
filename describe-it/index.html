<title>DescribeIt!</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap">
<style>
/* Layout: the roll is the page, from edge to edge: one line above it, one under it. Remarks are written on it, in one ink and one serif; everything else is called up and put away. One look, light. */
:root {
  color-scheme: light;
  --paper: #eef1f2;
  --roll: #fbfcfc;
  --band: #f2f5f5;
  --grid: #d2dadf;
  --ink: #17212a;
  --ink-2: #4c5b66;
  --ink-3: #8795a0;
  --line: #d4dce0;
  --raised: #ffffff;
  --rh: #2c47cf;
  --lh: #bf5412;
  --grace: #7a3fb0;
  --ghost: #74838e;
  --pencil: #2f3a44;
  --apart: #d0342c;
  --accent: #0b7566;
  --accent-soft: #dcefeb;
  --bad: #b02a20;
  --bad-soft: #f8e3e0;
  --font: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --serif: "Source Serif 4", "Iowan Old Style", Georgia, "Times New Roman", serif;
}

html, body { height: 100%; }
body { background: var(--raised); color: var(--ink); font-family: var(--font); font-size: 14px; line-height: 1.45; }
*, *::before, *::after { box-sizing: border-box; }
button, textarea, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app { height: 100%; display: flex; flex-direction: column; }

/* ---- the line above the roll ---- */
.top { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 16px; padding-block: 6px 4px; background: var(--raised);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.top h1 { margin: 0; font-family: var(--serif); font-weight: 700; font-size: 21px; letter-spacing: -0.005em; line-height: 1; }
.top .piece { margin: 0; color: var(--ink-2); font-size: 13px; min-width: 0; flex: 1 1 160px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
/* How far the notes still are from their shadows: one sentence, four numbers. */
.meters { display: flex; gap: 16px; align-items: center; border: 0; background: none; border-radius: 6px; padding: 3px 8px; margin: -3px -8px; text-align: left; }
.meters:hover, .meters[aria-expanded="true"] { background: var(--band); }
.meters .cap { font-size: 12px; color: var(--ink-2); white-space: nowrap; }
.meter { display: block; }
.meter .lab { display: flex; justify-content: space-between; align-items: baseline; gap: 7px; white-space: nowrap; }
.meter .name { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.06em; font-weight: 500; color: var(--ink-3); }
.meter .val { font-family: var(--mono); font-size: 12px; font-variant-numeric: tabular-nums; color: var(--ink); min-width: 5ch; text-align: right; }
.meter .track { display: block; height: 3px; border-radius: 2px; background: var(--line); overflow: hidden; margin-top: 2px; }
.meter .fill { display: block; height: 100%; width: 100%; background: var(--ink-2); transition: width 0.5s ease; }
.btn { border: 1px solid var(--line); background: var(--raised); border-radius: 6px; padding: 4px 10px; font-size: 13px; line-height: 1.3; white-space: nowrap; }
.btn:hover { border-color: var(--ink-3); }
.btn[aria-pressed="true"], .btn[aria-expanded="true"] { background: var(--ink); color: var(--raised); border-color: var(--ink); }
.btn.quiet { border-color: transparent; background: transparent; color: var(--ink-2); padding: 3px 6px; }
.btn.quiet:hover { color: var(--ink); background: var(--band); }
.btn.icon { min-width: 28px; padding: 4px 6px; text-align: center; font-family: var(--mono); }

/* ---- the roll ---- */
.stage { flex: 1 1 auto; min-height: 0; position: relative; background: var(--roll); overflow: hidden; display: flex; flex-direction: column; }
.rollscroll { flex: 1 1 auto; min-height: 0; overflow-x: auto; overflow-y: hidden; position: relative; }
.rollscroll canvas { position: sticky; left: 0; top: 0; display: block; touch-action: pan-x; cursor: crosshair; outline: none; }
.rollscroll canvas.pencil { touch-action: none; }
.rollscroll .spacer { height: 1px; margin-top: -1px; }
.foot { display: flex; align-items: center; gap: 6px 12px; padding-block: 4px; border-top: 1px solid var(--line); background: var(--raised); font-size: 12.5px; color: var(--ink-2); min-height: 36px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.foot #hint { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1 1 auto; }
.foot #hint button { border: 0; background: none; padding: 0; color: var(--accent); text-decoration: underline; text-underline-offset: 2px; }
.foot .zoom, .foot .play { display: inline-flex; gap: 6px; align-items: center; flex: 0 0 auto; }
.foot .zoom { gap: 3px; }
.btn.icon svg { display: block; margin: 2.5px auto; }
/* What is heard: one of three. */
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; background: var(--raised); overflow: hidden; }
.seg button { border: 0; background: none; padding: 4px 9px; font-size: 12.5px; line-height: 1.3; color: var(--ink-2); white-space: nowrap; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button:hover { color: var(--ink); background: var(--band); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--raised); }
.seg button:focus-visible { outline-offset: -2px; }
.loading { position: absolute; inset: 0; display: grid; place-items: center; color: var(--ink-2); background: var(--roll); z-index: 8; text-align: center; padding: 20px; }

/* ---- the pencil: where a remark is written, on the roll ---- */
.pen { position: absolute; z-index: 5; width: fit-content; max-width: min(300px, calc(100% - 24px)); pointer-events: none; }
.pen > * { pointer-events: auto; }
.pen { display: flex; flex-direction: column; }
.pen.up { flex-direction: column-reverse; }
.pen.up .under { margin: 0 0 5px; }
.pen .under { width: fit-content; max-width: 100%; }
.pen textarea { display: block; width: 150px; max-width: 100%; border: 0; border-bottom: 1.5px solid var(--pencil); border-radius: 0; background: rgba(255, 255, 255, 0.9); padding: 1px 3px 2px; font-family: var(--serif); font-weight: 500; font-size: 16px; line-height: 1.3; color: var(--ink); resize: none; overflow: hidden; outline: none; }
.pen textarea::placeholder { color: var(--ink-3); font-weight: 400; font-style: italic; }
.pen .under { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; margin-top: 5px; }
.chip { border: 1px solid var(--line); background: var(--raised); border-radius: 999px; padding: 1px 9px 2px; font-size: 12px; color: var(--ink-2); line-height: 1.4; }
.chip:hover { color: var(--ink); border-color: var(--ink-3); }
.pen .hear, .pen .turn { border: 1px solid var(--line); background: var(--raised); border-radius: 999px; padding: 1px 9px 2px; font-size: 12px; color: var(--ink-2); line-height: 1.4; display: inline-flex; align-items: center; gap: 5px; }
.pen .hear:hover, .pen .turn:hover { color: var(--ink); border-color: var(--ink-3); }
.pen .hear::before { content: ""; border-left: 7px solid currentColor; border-block: 4.5px solid transparent; }
.pen .keys { font-size: 11px; color: var(--ink-3); margin-left: 2px; background: rgba(251, 252, 252, 0.9); border-radius: 3px; padding: 0 3px; }

/* ---- what is called up ---- */
.pop, .menu, .legend { position: absolute; z-index: 6; background: var(--raised); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 8px 28px rgba(23, 33, 42, 0.16); }
.pop { width: min(330px, calc(100% - 16px)); padding: 11px 12px 9px 14px; display: flex; flex-direction: column; gap: 6px; max-height: calc(100% - 50px); overflow-y: auto; }
.pop::before { content: ""; position: absolute; left: 0; top: 10px; bottom: 10px; width: 3px; border-radius: 2px; background: var(--ink-3); }
.pop .said { font-family: var(--serif); font-weight: 600; font-size: 17px; line-height: 1.25; color: var(--ink); overflow-wrap: anywhere; }
.pop .where { font-size: 12px; color: var(--ink-3); display: flex; gap: 6px; align-items: baseline; flex-wrap: wrap; }
.pop .tag { font-size: 10px; text-transform: uppercase; letter-spacing: 0.07em; border: 1px solid var(--line); border-radius: 3px; padding: 0 4px; }
.pop .reading { color: var(--ink-2); font-size: 13px; overflow-wrap: anywhere; }
.pop .steps { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.step { font-family: var(--mono); font-size: 11.5px; background: var(--band); border-radius: 4px; padding: 1px 6px; white-space: nowrap; }
.step em { font-style: normal; color: var(--ink-3); }
.effect { font-family: var(--mono); font-size: 11.5px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.effect.none { color: var(--ink-3); }
.pop .err { background: var(--bad-soft); color: var(--bad); border-radius: 5px; padding: 5px 8px; font-size: 12.5px; overflow-wrap: anywhere; }
.pop .ask { background: var(--accent-soft); border-radius: 5px; padding: 6px 8px; font-size: 13px; overflow-wrap: anywhere; display: flex; flex-direction: column; gap: 5px; }
.pop .ask input { border: 1px solid var(--line); border-radius: 5px; padding: 4px 7px; background: var(--raised); width: 100%; }
.pop .acts { display: flex; gap: 2px; flex-wrap: wrap; align-items: center; margin-left: -6px; }
.pop details { font-size: 12px; }
.pop details summary { cursor: pointer; color: var(--ink-3); list-style: none; display: inline-block; }
.pop details summary::-webkit-details-marker { display: none; }
.pop details summary:hover { color: var(--ink); }
.pop textarea.calls { width: 100%; min-height: 110px; font-family: var(--mono); font-size: 11.5px; border: 1px solid var(--line); border-radius: 5px; background: var(--roll); padding: 6px; margin-top: 5px; white-space: pre; overflow: auto; resize: vertical; }
.pop .list { font-family: var(--mono); font-size: 11px; color: var(--ink-2); margin: 5px 0 0; padding: 0; list-style: none; max-height: 120px; overflow: auto; white-space: nowrap; }
.pop .note { font-size: 12px; color: var(--ink-3); }
.pulse { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); animation: pulse 1.1s ease-in-out infinite; margin-right: 6px; }
@keyframes pulse { 0%, 100% { opacity: 0.25; } 50% { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .pulse { animation: none; } .meter .fill { transition: none; } }

.menu { right: 8px; top: 8px; padding: 5px; display: flex; flex-direction: column; min-width: 230px; }
.menu button { border: 0; background: none; text-align: left; padding: 6px 9px; border-radius: 5px; font-size: 13px; display: flex; justify-content: space-between; gap: 14px; }
.menu button:hover { background: var(--band); }
.menu button span { color: var(--ink-3); }
.menu .row { display: flex; justify-content: space-between; align-items: center; gap: 14px; padding: 4px 9px; font-size: 13px; }
.menu .row span { display: inline-flex; gap: 3px; }
.menu .credit { margin: 4px 0 0; padding: 6px 9px 3px; border-top: 1px solid var(--line); font-size: 11.5px; color: var(--ink-3); max-width: 250px; }
.menu .credit a { color: inherit; }
.menu .row button { display: inline-block; border: 1px solid var(--line); border-radius: 5px; padding: 1px 9px; font-family: var(--mono); text-align: center; }

.legend { right: 8px; top: 8px; width: min(400px, calc(100% - 16px)); max-height: calc(100% - 16px); overflow-y: auto; padding: 12px 14px 12px; font-size: 13px; color: var(--ink-2); }
.legend h2 { margin: 0 0 4px; font-family: var(--serif); font-weight: 600; font-size: 16px; line-height: 1.25; color: var(--ink); text-wrap: balance; }
.legend p { margin: 0 0 8px; }
.legend dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 7px 12px; }
.legend dt { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.06em; font-weight: 500; color: var(--ink); padding-top: 2px; white-space: nowrap; }
.legend dd { margin: 0; }
.legend dd .now { display: block; font-family: var(--mono); font-size: 11.5px; font-variant-numeric: tabular-nums; color: var(--ink-3); }

.tip { position: absolute; z-index: 7; pointer-events: none; background: var(--ink); color: #fff; border-radius: 6px; padding: 6px 9px; font-size: 12px; line-height: 1.4; max-width: 300px; box-shadow: 0 4px 14px rgba(0, 0, 0, 0.2); }
.tip b { font-weight: 600; }
.tip .row { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.tip .k { opacity: 0.65; display: inline-block; min-width: 46px; font-family: var(--font); }

.drawer { position: absolute; z-index: 6; top: 0; right: 0; bottom: 0; width: min(440px, 100%); background: var(--raised); border-left: 1px solid var(--line); box-shadow: -8px 0 28px rgba(23, 33, 42, 0.1); display: flex; flex-direction: column; gap: 8px; padding: 10px 12px 12px; }
.drawer .bar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.drawer .bar h2 { margin: 0 auto 0 0; font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; font-weight: 600; color: var(--ink-2); }
.drawer .counts { display: flex; flex-wrap: wrap; gap: 4px; }
pre.xml { margin: 0; font-family: var(--mono); font-size: 11.5px; line-height: 1.5; background: var(--roll); border: 1px solid var(--line); border-radius: 6px; padding: 9px 10px; overflow: auto; white-space: pre; flex: 1 1 auto; min-height: 0; }
pre.xml .t { color: var(--rh); } pre.xml .a { color: var(--ink-2); } pre.xml .v { color: var(--lh); }
pre.xml .hot { background: var(--accent-soft); }

@media (max-width: 720px) {
  .meters { flex: 1 1 100%; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 2px 10px; order: 5; }
  .meters .cap { grid-column: 1 / -1; }
  .meter .lab { flex-direction: column; align-items: flex-start; gap: 0; }
  .meter .val { text-align: left; }
  .top .piece { flex-basis: 120px; }
  .foot { flex-wrap: wrap; }
  .foot #hint { order: -1; flex: 1 1 100%; }
  .foot .zoom { margin-left: auto; }
}
</style>

<div class="app">
  <header class="top">
    <h1>DescribeIt!</h1>
    <p class="piece" id="pieceName">Schumann, Träumerei — Alfred Grünfeld on Welte-Mignon roll 225</p>
    <button class="meters" id="meters" aria-expanded="false" aria-controls="legend" title="How far the notes still are from their shadows, on average. Click for what each number means.">
      <span class="cap">Notes still off their shadows by</span>
      <span class="meter" data-k="pulse"><span class="lab"><span class="name">Timing</span><span class="val">–</span></span><span class="track"><span class="fill"></span></span></span>
      <span class="meter" data-k="chords"><span class="lab"><span class="name">In chords</span><span class="val">–</span></span><span class="track"><span class="fill"></span></span></span>
      <span class="meter" data-k="loud"><span class="lab"><span class="name">Loudness</span><span class="val">–</span></span><span class="track"><span class="fill"></span></span></span>
      <span class="meter" data-k="length"><span class="lab"><span class="name">Length</span><span class="val">–</span></span><span class="track"><span class="fill"></span></span></span>
    </button>
    <button class="btn" id="mpmBtn" aria-expanded="false" title="The MPM your remarks have become">MPM</button>
    <button class="btn icon" id="menuBtn" aria-expanded="false" aria-label="More">⋯</button>
  </header>

  <main class="stage" id="stage">
    <div class="rollscroll" id="rollScroll">
      <canvas id="roll" tabindex="0" aria-label="Piano roll on the recording's clock: the notes as the MPM so far renders them, each with a shadow where it was played. Drag across it to bracket a passage, click a note, or type to speak about the whole piece."></canvas>
      <div class="spacer" id="rollSpacer"></div>
    </div>
    <div class="foot">
      <span class="play">
        <button class="btn icon" id="playBtn" aria-pressed="false" aria-label="Play" title="Play from the line, or what is selected (Space)"><svg viewBox="0 0 12 12" width="12" height="12" aria-hidden="true"><path id="playIcon" d="M2.5 1v10l8.5-5z" fill="currentColor"/></svg></button>
        <span class="seg" id="hear" role="group" aria-label="What is heard">
          <button data-src="played" aria-pressed="true" title="Hear the notes as they were played: the shadows">as played</button>
          <button data-src="mpm" aria-pressed="false" title="Hear the notes as the MPM so far renders them">the MPM</button>
          <button data-src="both" aria-pressed="false" title="Hear both at once: the playing to the left, the MPM to the right">both</button>
        </span>
      </span>
      <span id="hint"></span>
      <span class="zoom">
        <button class="btn icon" id="pencilBtn" aria-pressed="false" title="Draw brackets with a finger" hidden>✎</button>
        <button class="btn icon" id="zoomOut" aria-label="Zoom out">−</button>
        <button class="btn icon" id="zoomIn" aria-label="Zoom in">+</button>
        <button class="btn" id="zoomFit">Fit</button>
      </span>
    </div>

    <div class="pen" id="pen" hidden>
      <textarea id="penText" rows="1" aria-label="Your remark" autocomplete="off" spellcheck="false"></textarea>
      <div class="under" id="penUnder"></div>
    </div>
    <div class="pop" id="pop" hidden></div>
    <div class="tip" id="tip" hidden></div>
    <div class="legend" id="legend" hidden></div>
    <div class="menu" id="menu" hidden>
      <button id="refBtn">Compare with the published reconstruction <span id="refState">off</span></button>
      <button id="ghostBtn" title="Behind each note, faint and dashed: the note as it was played">Shadows of the notes as played <span id="ghostState">on</span></button>
      <div class="row" title="How much taller a louder note is drawn">Height of loud notes <span><button id="lowerBtn" aria-label="Lower">−</button><button id="higherBtn" aria-label="Taller">+</button></span></div>
      <button id="fullBtn" hidden>Full screen <span id="fullState">off</span></button>
      <button id="clearBtn">Remove every remark</button>
      <p class="credit">Piano: Salamander Grand Piano V3 by Alexander Holm, <a href="https://creativecommons.org/licenses/by/3.0/">CC BY 3.0</a>, as converted for @tonejs/piano.</p>
    </div>
    <aside class="drawer" id="drawer" hidden aria-label="MPM">
      <div class="bar">
        <h2>MPM</h2>
        <button class="btn" id="copyMpm">Copy</button>
        <button class="btn" id="saveMpm" hidden>Save .mpm</button>
        <button class="btn" id="saveWork" hidden title="The calls as the MPM Desk reads them, numbers stated">Save work.json</button>
        <button class="btn icon" id="closeDrawer" aria-label="Close">×</button>
      </div>
      <div class="counts" id="mpmCounts"></div>
      <pre class="xml" id="mpmXml" tabindex="0"></pre>
    </aside>
    <div class="loading" id="loading">Loading the roll…</div>
  </main>
</div>

<script type="module" src="app.js"></script>
